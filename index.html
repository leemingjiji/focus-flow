<title>專注循環｜Focus Flow</title><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="icon" type="image/png" href="./icon-192.png">
<style>
:root{color-scheme:dark;--bg:#0d1520;--card:#172333;--soft:#233247;--line:#304257;--text:#f3f6fb;--muted:#a1b0c2;--accent:#ff628f;--warn:#ffcb82;--danger:#ff9b9b}*{box-sizing:border-box}html{font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 75% -20%,#2a203d 0%,transparent 49%),#090b13;color:var(--text)}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.wrap{max-width:940px;margin:auto;padding:28px 18px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:14px;font-weight:800;letter-spacing:.15em;color:var(--accent)}.pill{background:#223343;border:1px solid #3a5365;border-radius:99px;padding:7px 11px;font-size:12px;color:#b6ced3}h1{font-size:clamp(27px,5vw,43px);margin:16px 0 6px;letter-spacing:-.04em}p.sub{color:var(--muted);margin:0 0 22px;font-size:14px}.layout{display:grid;grid-template-columns:1.05fr .95fr;gap:18px}.panel{background:rgba(21,24,36,.95);border:1px solid var(--line);border-radius:22px;padding:22px;min-width:0}.minor{color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.08em}.stage{font-size:22px;font-weight:700;margin:12px 0 0;overflow-wrap:anywhere;min-height:30px}.stage.rest{color:#76e7c6}.time{font-variant-numeric:tabular-nums;font-size:clamp(64px,11vw,99px);font-weight:750;letter-spacing:-.07em;line-height:1.25;text-align:center;margin:24px 0}.ring-wrap{position:relative;width:min(100%,370px);aspect-ratio:1;margin:13px auto 0;display:grid;place-items:center}.timer-ring{width:100%;height:100%;overflow:visible;transform:rotate(-90deg)}.ring-track,.ring-fill,.ring-halo{fill:none;stroke-width:23}.ring-track{stroke:#30313d}.ring-fill,.ring-halo{stroke:url(#workGradient);stroke-linecap:round;stroke-dasharray:779.115;stroke-dashoffset:779.115;transition:stroke-dashoffset .25s linear,opacity .25s ease}.ring-halo{filter:url(#ringGlow);opacity:.28;stroke-width:25}.ring-wrap.rest .ring-fill,.ring-wrap.rest .ring-halo{stroke:url(#restGradient)}.ring-wrap.idle .ring-fill,.ring-wrap.idle .ring-halo{opacity:0}.ring-center{position:absolute;inset:42px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;pointer-events:none;text-align:center}.ring-eyebrow{color:#a5a6b2;font-size:11px;letter-spacing:.17em;font-weight:800}.time{font-variant-numeric:tabular-nums;font-size:clamp(48px,8vw,69px);font-weight:800;letter-spacing:-.065em;line-height:1.15;text-align:center;margin:0;font-feature-settings:"tnum"}.ring-hint{font-size:16px;color:var(--text);font-weight:600;max-width:min(190px,100%);line-height:1.4;overflow-wrap:anywhere}.ring-hint.long-name{font-size:12px;max-width:150px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden}.ring-wrap.rest .ring-eyebrow{color:#66e7c7}.ring-wrap.work .ring-eyebrow{color:#ff829e}.status{text-align:center;color:var(--muted);font-size:13px;margin:10px 0 21px;min-height:18px}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:13px 18px;background:var(--soft);color:var(--text);font-weight:700;min-height:46px}.btn.primary{background:linear-gradient(110deg,#ff487c,#ff8562);color:#250e1b;flex:1}.btn.danger{color:var(--danger)}.btn.sm{padding:8px 11px;min-height:36px;font-size:13px}.section-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:15px}.section-head h2{font-size:18px;margin:0}.count{font-size:12px;color:var(--muted)}label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}.field{width:100%;background:#101b29;border:1px solid #405064;color:var(--text);border-radius:12px;padding:13px;outline:none}.field:focus{border-color:var(--accent)}.fields{display:grid;grid-template-columns:1fr 116px;gap:10px}.add{width:100%;margin-top:12px}.task-list{margin:20px 0 0;display:flex;flex-direction:column;gap:10px}.task{border:1px solid #3b4c60;border-radius:14px;background:#1a2a3a;padding:12px;display:flex;align-items:center;gap:8px;justify-content:space-between}.task.active{border-color:var(--accent);background:#1b3a3a}.task-name{font-weight:700;overflow-wrap:anywhere}.task-duration{font-size:12px;color:var(--muted);margin-top:3px}.task-info{min-width:0;flex:1}.task-actions{display:flex;align-items:center;gap:5px;flex-shrink:0;flex-wrap:wrap;justify-content:flex-end}.empty{padding:24px 12px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed #435264;border-radius:14px}.extras{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:15px}.check{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px}.check input{accent-color:var(--accent);width:17px;height:17px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.stat{background:#101d2b;border:1px solid #31475a;padding:13px;border-radius:13px}.stat strong{font-size:24px;display:block}.stat span{color:var(--muted);font-size:12px}.history{margin-top:15px;font-size:13px;color:var(--muted)}.history div{padding:7px 0;border-bottom:1px solid #304257}.foot{color:#8d9cad;font-size:12px;margin-top:16px;line-height:1.7}.overlay{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:18px;z-index:5}.overlay.show{display:flex}.dialog{background:#1b2b3c;border:1px solid #506276;border-radius:18px;padding:22px;width:min(420px,100%)}.dialog h3{margin:0 0 20px}.dialog .row{display:flex;gap:8px;margin-top:16px}.dialog .row button{flex:1}.hidden{display:none!important}@media(max-width:700px){.wrap{padding:19px 14px 40px}.layout{grid-template-columns:1fr}.panel{padding:18px}.ring-wrap{width:min(100%,340px);margin:8px auto 0}.ring-center{inset:35px}.time{font-size:clamp(47px,13vw,63px)}.top .pill{max-width:160px;text-align:center}.task-actions .btn{padding:8px 9px}.task{align-items:flex-start;flex-direction:column}.task-actions{width:100%;justify-content:flex-start}}
</style>
</head><body>
<div class="wrap"><div id="startupNotice" role="alert" style="background:#48301e;color:#ffdf9d;padding:12px;border-radius:12px;margin-bottom:15px;font-size:14px">⚠️ 程式尚未啟動。如果這則提示持續出現，請重新整理頁面。</div>
<div class="layout"><section class="panel" aria-label="計時器"><div class="ring-wrap" id="ringWrap"><svg class="timer-ring" viewBox="0 0 320 320" role="img" aria-label="剩餘時間進度圓環"><defs><linearGradient id="workGradient" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#ff3e8a"/><stop offset="42%" stop-color="#ff586c"/><stop offset="100%" stop-color="#ffae30"/></linearGradient><linearGradient id="restGradient" x1="0%" y1="100%" x2="100%" y2="0%"><stop offset="0%" stop-color="#11cbd4"/><stop offset="48%" stop-color="#52e9b1"/><stop offset="100%" stop-color="#a3f66b"/></linearGradient><filter id="ringGlow" x="-35%" y="-35%" width="170%" height="170%"><feGaussianBlur stdDeviation="6" /></filter></defs><circle class="ring-track" cx="160" cy="160" r="124"/><circle class="ring-halo" id="ringHalo" cx="160" cy="160" r="124"/><circle class="ring-fill" id="ringFill" cx="160" cy="160" r="124"/></svg><div class="ring-center"><div class="time" id="time" role="timer" aria-live="off">00:00</div><span class="ring-hint" id="ringHint">選擇任務開始</span></div></div><div class="status hidden" id="status" role="status"></div><div class="actions"><button class="btn primary hidden" id="pause">暫停</button><button class="btn hidden" id="skip">跳過休息</button><button class="btn danger hidden" id="stop">結束此任務</button></div><div class="extras"><label class="check"><input type="checkbox" id="sound" checked> 結束提示音</label><button class="btn sm" id="testSound" type="button">試聽</button></div><div class="stats"><div class="stat"><strong id="doneCount">0</strong><span>今日完成任務</span></div><div class="stat"><strong id="doneMins">0</strong><span>今日完成分鐘</span></div></div><div class="history" id="history"></div></section>
<section class="panel"><div class="section-head"><h2>我的任務</h2><span class="count" id="count">0 個待辦</span></div><form id="addForm"><div class="fields"><div><label for="name">我要做的事</label><input id="name" class="field" maxlength="80" placeholder="例如：剪輯 Reels" required></div><div><label for="minutes">分鐘</label><input id="minutes" class="field" type="number" min="1" max="1440" step="1" value="25" required></div></div><button class="btn primary add" type="submit">＋ 新增任務</button><div id="addFeedback" role="status" aria-live="polite" style="font-size:13px;color:#76e7c6;min-height:18px;margin-top:8px"></div></form><div class="task-list" id="tasks"></div></section></div>
</div>
<div class="overlay" id="editOverlay" role="dialog" aria-modal="true" aria-labelledby="editTitle"><form class="dialog" id="editForm"><h3 id="editTitle">修改任務</h3><label for="editName">任務名稱</label><input id="editName" class="field" maxlength="80" required><div style="height:14px"></div><label for="editMinutes">時間（分鐘）</label><input id="editMinutes" class="field" type="number" min="1" max="1440" step="1" required><p class="foot">正在計時的任務，修改時間後會重新開始計時。</p><div class="row"><button type="button" class="btn" id="cancelEdit">取消</button><button class="btn primary" type="submit">儲存修改</button></div></form></div>
<noscript><div style="padding:15px;background:#602929;color:white">這個網頁需要 JavaScript 才能新增與管理任務。請改用支援 JavaScript 的瀏覽器開啟。</div></noscript><script>
(()=>{'use strict';
const KEY='focus-flow-v2',OLD_KEY='focus-flow-v1',REST_MS=10*60*1000,$=id=>document.getElementById(id);
let state={tasks:[],phase:'idle',activeId:null,endAt:null,remaining:0,total:0,completed:[],sound:true},editingId=null,audioCtx=null;
try{let stored=JSON.parse((localStorage.getItem(KEY)||localStorage.getItem(OLD_KEY)));if(stored&&Array.isArray(stored.tasks)&&['idle','work','rest'].includes(stored.phase)) state={...state,...stored,completed:Array.isArray(stored.completed)?stored.completed:[],sound:stored.sound!==false};}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){}}
function uid(){try{if(typeof globalThis.crypto!=='undefined'&&typeof globalThis.crypto.randomUUID==='function')return globalThis.crypto.randomUUID()}catch(e){}return 'task-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}
function validMinutes(n){return Number.isInteger(n)&&n>=1&&n<=1440}
function fmt(ms){let s=Math.ceil(Math.max(0,ms)/1000),m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function remaining(){return state.endAt!==null?Math.max(0,state.endAt-Date.now()):Math.max(0,state.remaining)}
function task(){return state.tasks.find(x=>x.id===state.activeId)}
function playTone(){if(!state.sound)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audioCtx=audioCtx||new C();audioCtx.resume();[0,.19,.38].forEach((delay,i)=>{const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),t=audioCtx.currentTime+delay;osc.type='sine';osc.frequency.value=[784,988,1175][i];gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(.14,t+.015);gain.gain.exponentialRampToValueAtTime(.0001,t+.15);osc.connect(gain);gain.connect(audioCtx.destination);osc.start(t);osc.stop(t+.16)})}catch(e){}}
function notify(title,body){playTone();if('Notification'in window&&Notification.permission==='granted')try{new Notification(title,{body})}catch(e){};try{if(navigator.vibrate)navigator.vibrate([100,80,100]);}catch(e){}}
function rest(startTime=Date.now()){state.phase='rest';state.activeId=null;state.total=REST_MS;state.remaining=REST_MS;state.endAt=startTime+REST_MS}
function reset(){state.phase='idle';state.activeId=null;state.endAt=null;state.remaining=0;state.total=0}
function reconcile(){let changed=false;let now=Date.now();if(state.phase==='work'&&!task()){reset();changed=true}
if(state.endAt!==null&&now>=state.endAt){if(state.phase==='work'){const finished=task();const completedAt=state.endAt;state.tasks=state.tasks.filter(x=>x.id!==state.activeId);state.completed.push({name:finished?.name||'任務',minutes:finished?.minutes||Math.round(state.total/60000),at:completedAt});state.completed=state.completed.slice(-300);rest(completedAt);notify('專注完成','已完成「'+(finished?.name||'任務')+'」，休息 10 分鐘');changed=true}if(state.phase==='rest'&&now>=state.endAt){reset();notify('休息結束','可以選下一個任務了');changed=true}}if(changed)save();return changed}
function moveTask(id,direction){const idx=state.tasks.findIndex(x=>x.id===id),next=idx+direction;if(idx<0||next<0||next>=state.tasks.length)return;[state.tasks[idx],state.tasks[next]]=[state.tasks[next],state.tasks[idx]];save();render()}
function startTask(id){if(state.phase!=='idle')return;let t=state.tasks.find(x=>x.id===id);if(!t)return;state.phase='work';state.activeId=id;state.total=t.minutes*60000;state.remaining=state.total;state.endAt=Date.now()+state.total;save();render()}
function toggle(){if(!['work','rest'].includes(state.phase))return;if(state.endAt!==null){state.remaining=remaining();state.endAt=null}else state.endAt=Date.now()+state.remaining;save();render()}
function stop(){if(state.phase!=='work')return;if(!confirm('確定結束目前的任務？它會留在待辦清單中。'))return;reset();save();render()}
function skip(){if(state.phase!=='rest')return;reset();save();render()}
function del(id){let t=state.tasks.find(x=>x.id===id);if(!t)return;if(!confirm('確定刪除「'+t.name+'」？'))return;if(state.phase==='work'&&state.activeId===id)reset();state.tasks=state.tasks.filter(x=>x.id!==id);save();render()}
function openEdit(id){let t=state.tasks.find(x=>x.id===id);if(!t)return;editingId=id;$('editName').value=t.name;$('editMinutes').value=t.minutes;$('editOverlay').classList.add('show');$('editName').focus()}
function closeEdit(){$('editOverlay').classList.remove('show');editingId=null}
const CIRCUMFERENCE=2*Math.PI*124;
function updateRing(){const active=state.phase==='work'||state.phase==='rest';const ratio=active&&state.total>0?Math.min(1,Math.max(0,remaining()/state.total)):0;const offset=CIRCUMFERENCE*(1-ratio);$('ringFill').style.strokeDasharray=CIRCUMFERENCE;$('ringFill').style.strokeDashoffset=offset;$('ringHalo').style.strokeDasharray=CIRCUMFERENCE;$('ringHalo').style.strokeDashoffset=offset;$('ringWrap').className='ring-wrap '+(state.phase==='work'?'work':state.phase==='rest'?'rest':'idle');$('ringHint').textContent=state.phase==='work'?(task()?.name||'目前任務'):state.phase==='rest'?'休息中':'選擇任務開始';$('ringHint').classList.toggle('long-name',$('ringHint').textContent.length>32);$('ringHint').title=$('ringHint').textContent}
function render(){reconcile();const t=task(),isWork=state.phase==='work',isRest=state.phase==='rest',active=isWork||isRest,paused=active&&state.endAt===null;
document.title=(active?fmt(remaining())+' · ':'')+(isWork?'專注中':isRest?'休息中':'專注循環');
$('time').textContent=active?fmt(remaining()):'00:00';updateRing();
$('status').textContent=paused?'已暫停':'';$('status').classList.toggle('hidden',!paused);
const today=new Date().toLocaleDateString('en-CA');const done=(state.completed||[]).filter(x=>new Date(x.at).toLocaleDateString('en-CA')===today);$('doneCount').textContent=done.length;$('doneMins').textContent=done.reduce((a,x)=>a+(x.minutes||0),0);$('sound').checked=state.sound!==false;const hist=$('history');hist.replaceChildren();if(done.length){const head=document.createElement('strong');head.textContent='今日完成紀錄';hist.append(head);done.slice(-3).reverse().forEach(x=>{const row=document.createElement('div');row.textContent='✓ '+x.name+' · '+x.minutes+' 分鐘';hist.append(row)})}
$('pause').classList.toggle('hidden',!active);$('pause').textContent=paused?'▶ 繼續':'Ⅱ 暫停';$('stop').classList.toggle('hidden',!isWork);$('skip').classList.toggle('hidden',!isRest);$('count').textContent=state.tasks.length+' 個待辦';
const list=$('tasks');list.replaceChildren();if(!state.tasks.length){let e=document.createElement('div');e.className='empty';e.textContent='還沒有任務，先新增第一件要做的事';list.append(e)}
state.tasks.forEach(x=>{let el=document.createElement('div');el.className='task'+(isWork&&state.activeId===x.id?' active':'');let info=document.createElement('div');info.className='task-info';let n=document.createElement('div');n.className='task-name';n.textContent=x.name;let d=document.createElement('div');d.className='task-duration';d.textContent=x.minutes+' 分鐘'+(isWork&&state.activeId===x.id?' · 進行中':'');info.append(n,d);let acts=document.createElement('div');acts.className='task-actions';let begin=document.createElement('button');begin.className='btn sm primary';begin.textContent=isWork&&state.activeId===x.id?'執行中':'開始';begin.disabled=state.phase!=='idle';begin.onclick=()=>startTask(x.id);let edit=document.createElement('button');edit.className='btn sm';edit.textContent='修改';edit.onclick=()=>openEdit(x.id);let remove=document.createElement('button');remove.className='btn sm danger';remove.textContent='刪除';remove.onclick=()=>del(x.id);let up=document.createElement('button');up.className='btn sm';up.textContent='↑';up.title='向上移動';up.setAttribute('aria-label','將'+x.name+'向上移動');up.disabled=state.tasks[0]?.id===x.id;up.onclick=()=>moveTask(x.id,-1);let down=document.createElement('button');down.className='btn sm';down.textContent='↓';down.title='向下移動';down.setAttribute('aria-label','將'+x.name+'向下移動');down.disabled=state.tasks[state.tasks.length-1]?.id===x.id;down.onclick=()=>moveTask(x.id,1);acts.append(begin,up,down,edit,remove);el.append(info,acts);list.append(el)})}
$('addForm').addEventListener('submit',e=>{e.preventDefault();let name=$('name').value.trim(),minutes=Number($('minutes').value);if(!name||!validMinutes(minutes))return alert('請輸入任務名稱與 1–1440 分鐘的整數時間');try{const newTask={id:uid(),name,minutes};state.tasks.push(newTask);save();render();$('name').value='';$('addFeedback').textContent='✓ 已加入清單：'+name;$('name').focus()}catch(err){$('addFeedback').textContent='新增失敗，請重試';$('addFeedback').style.color='#ff9b9b';console.error('Failed to add task',err)}});
$('sound').addEventListener('change',e=>{state.sound=e.target.checked;save()});$('testSound').onclick=()=>{try{const C=window.AudioContext||window.webkitAudioContext;audioCtx=audioCtx||(C?new C():null)}catch(e){}playTone()};$('pause').onclick=toggle;$('stop').onclick=stop;$('skip').onclick=skip;$('cancelEdit').onclick=closeEdit;$('editOverlay').addEventListener('click',e=>{if(e.target===$('editOverlay'))closeEdit()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeEdit()});
$('editForm').addEventListener('submit',e=>{e.preventDefault();let t=state.tasks.find(x=>x.id===editingId),name=$('editName').value.trim(),minutes=Number($('editMinutes').value);if(!t||!name||!validMinutes(minutes))return alert('請輸入正確的名稱與分鐘數');t.name=name;t.minutes=minutes;if(state.phase==='work'&&state.activeId===t.id){state.total=minutes*60000;state.remaining=state.total;state.endAt=state.endAt===null?null:Date.now()+state.total}closeEdit();save();render()});
if('Notification'in window&&Notification.permission==='default'){document.addEventListener('click',function ask(e){if(!e.target.closest('#addForm button, .task-actions .primary'))return;Notification.requestPermission().catch(()=>{});document.removeEventListener('click',ask)}, {capture:true})}
$('startupNotice').style.display='none';window.addEventListener('storage',e=>{if(e.key===KEY){try{const v=JSON.parse(e.newValue);if(v&&Array.isArray(v.tasks)){state={...state,...v};render()}}catch(err){}}});window.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}setInterval(()=>{if(reconcile())render();else if(state.phase!=='idle'){let r=remaining();$('time').textContent=fmt(r);document.title=fmt(r)+' · '+(state.phase==='work'?'專注中':'休息中');updateRing()}},250);render();
})();
</script></body></html>
